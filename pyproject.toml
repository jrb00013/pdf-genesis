[project]
name = "pdf-genesis"
version = "0.5.0"
description = "Research PDF generator: JSON exports or full repo (markdown + manifest pipeline)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "reportlab>=4.0",
  "pydantic>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pdf-genesis = "pdf_genesis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
