[project]
name = "pdf-genesis"
version = "0.1.0"
description = "Research PDF generator from differential-harness exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "reportlab>=4.0",
  "pydantic>=2.0",
]

[project.scripts]
pdf-genesis = "pdf_genesis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
